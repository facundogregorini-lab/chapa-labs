<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Commercial OS · Chapa Labs</title>
<meta name="description" content="Panel de prospección de Chapa Labs: la operación comercial de Turnia y habita. sobre un mismo motor, sincronizada con la planilla de cada una.">
<meta name="theme-color" content="#f7f9f6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231baf7a'/%3E%3Cpath d='M7 9h18l-7 8v6l-4 2v-8z' fill='white'/%3E%3C/svg%3E">
<!-- Habita's workspace uses Manrope. Chapa previously declared it in CSS
     without loading the family, so the browser fell back to Segoe UI. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/prospecting/glass.css">
<link rel="stylesheet" href="/prospecting/commercial-os.css?v=20261112-comentarios">
<link rel="stylesheet" href="/prospecting/pool.css?v=20261111-prospectos">
</head>
<body data-unit="todas">
<div class="ambient" aria-hidden="true"><div class="photo"></div><i></i><i></i><i></i></div>

<div class="os-shell">
  <aside class="os-sidebar" aria-label="Centro de operaciones comerciales">
    <a class="os-brand" href="/prospecting?vista=resumen" aria-label="Chapa Labs · Inicio">
      <span class="os-brand-icon" aria-hidden="true">C<span>•</span></span>
      <span><strong>CHAPA LABS</strong><small>COMMERCIAL OS</small></span>
    </a>
    <div class="os-section-label">ESPACIOS DE TRABAJO</div>
    <div class="os-business-list" id="units" role="group" aria-label="Unidad de negocio"></div>
    <div class="os-section-label">NAVEGACIÓN</div>
    <nav class="os-nav" id="tabs" role="tablist" aria-label="Vistas comerciales"></nav>
    <div class="os-section-label os-legacy-title">HERRAMIENTAS DEL PRODUCTO</div>
    <nav class="os-nav os-legacy-nav" id="legacy-tabs" aria-label="Herramientas adicionales"></nav>
    <div class="os-sidebar-footer">
      <a href="/" class="os-return">↗ &nbsp; TABLERO CHAPA</a>
      <span>UN WORKSPACE. DOS NEGOCIOS.</span>
    </div>
  </aside>
  <div class="os-workspace">
    <header class="top os-top" id="top">
      <div class="os-breadcrumb">
        <span>OPERACIÓN COMERCIAL</span>
        <strong id="os-place">GENERAL</strong>
      </div>
      <div class="os-top-actions">
        <div class="gsearch" role="search">
          <input class="input" id="gsearch" type="search" placeholder="Buscar nombre, teléfono o código" aria-label="Buscar una cuenta en todo el panel" aria-controls="gresults" aria-expanded="false" autocomplete="off" data-testid="global-search">
          <div class="gresults glass strong" id="gresults" role="listbox" aria-label="Resultados" hidden></div>
        </div>
        <button class="btn icon ghost" id="theme" type="button" aria-label="Cambiar tema claro u oscuro" title="Tema claro / oscuro"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
        <button class="btn icon os-user" id="user" type="button" hidden></button>
      </div>
    </header>
    <main id="main" tabindex="-1"><div class="skeleton"></div><div class="skeleton"></div></main>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer glass strong" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden data-liquid="28" data-liquid-bezel="30" data-liquid-blur="18"></aside>
<div class="confirm glass strong" id="confirm" role="alertdialog" aria-live="polite" data-liquid="30" data-liquid-blur="10"></div>
<div class="toast glass strong" id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip" hidden></div>

<script src="/prospecting/glass.js"></script>
<script src="/prospecting/core.js"></script>
<script src="/prospecting/agencies.js"></script>
<script src="/prospecting/units.js"></script>
<script src="/prospecting/followup.js"></script>
<script src="/prospecting/whatsapp-mobile.js"></script>
<script src="/prospecting/results-view.js?v=20261111-mobile-limpio"></script>
<script src="/prospecting/pool-view.js?v=20261111-prospectos"></script>
<script src="/prospecting/overview.js?v=20261111-mobile-limpio"></script>
<script src="/prospecting/app.js?v=20261112-comentarios"></script>
<script src="/prospecting/voice.js"></script>
</body>
</html>
